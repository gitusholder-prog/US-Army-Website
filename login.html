<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>
<h1>Log In</h1>

<input id="email" type="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button onclick="login()">Log In</button>

<p id="msg"></p>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB8zuszRC6de0R2Tc6WT1-dzRLU7m6IEhc",
        authDomain: "robloxarmydatabase.firebaseapp.com",
        projectId: "1:100350015218:web:4dd2dd0529f94c89c7826b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = function () {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, email, password)
            .then(() => document.getElementById("msg").innerText = "Logged in!")
            .catch(err => document.getElementById("msg").innerText = err.message);
    };
</script>
</body>
</html>
